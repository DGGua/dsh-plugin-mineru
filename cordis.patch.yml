# dsh-mineru bundle layer: inserts the dsh-mineru plugin row.
# Loaded by `dsh plugin --profile <name> add @huanlin/dsh-plugin-mineru`.
# The `name` is the package entry; Loader resolves it from profile node_modules.
# mode picks the transport: `local` (self-hosted FastAPI server, baseURL below)
# or `cloud` (mineru.net precise-parsing API v4, token via cloudApiKeyEnv).
# Values below are the first-boot seed only; runtime edits persist through the
# DSH GUI settings page (Plugins list → dsh-mineru → Configure).
- insert:
    - id: dsh-mineru
      name: '@huanlin/dsh-plugin-mineru'
      config:
        mode: 'local'
        baseURL: 'http://localhost:18000'
